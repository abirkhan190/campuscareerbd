<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employer Login | CampusCareer BD</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
<div class="auth-container">
    <div class="auth-box">
        <a href="index.html" class="logo">
            CampusCareer<span>BD</span>
        </a>
        <h2>Employer Login</h2>
        <p>Manage your job posts and applicants.</p>
        <form id="employerLoginForm">
            <label>Company Email</label>
            <input type="email" id="employerLoginEmail" placeholder="Enter your email" required>
            <label>Password</label>
            <input type="password" id="employerLoginPassword" placeholder="Enter your password" required>
            <button type="submit" class="full-btn">Login</button>
        </form>
        <p id="employerLoginError" class="error-text"></p>
        <p class="auth-bottom">
            Don't have an account? <a href="employer-register.html">Register</a>
        </p>
        <p class="auth-bottom small-link">
            Student? <a href="login.html">Login here</a>
        </p>
    </div>
</div>
<script src="js/script.js"></script>
</body>
</html>
