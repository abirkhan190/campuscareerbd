<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | CampusCareer BD</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
<div class="auth-container">
    <div class="auth-box">
        <a href="index.html" class="logo">
            CampusCareer<span>BD</span>
        </a>
        <h2>Create Account</h2>
        <p>Start your career journey today.</p>
        <form id="registerForm">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name" required>
            <label>Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>
            <label>University</label>
            <input type="text" id="university" placeholder="Enter university name" required>
            <label>Password</label>
            <input type="password" id="password" placeholder="Create password" required>
            <button type="submit" class="full-btn">Create Account</button>
        </form>
        <p class="auth-bottom">
            Already have an account? <a href="login.html">Login</a>
        </p>
        <p class="auth-bottom small-link">
            Are you an employer? <a href="employer-register.html">Register here</a>
        </p>
    </div>
</div>
<script src="js/script.js"></script>
</body>
</html>
