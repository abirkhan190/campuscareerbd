<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | CampusCareer BD</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
<div class="auth-container">
    <div class="auth-box">
        <a href="index.html" class="logo">
            CampusCareer<span>BD</span>
        </a>
        <h2>Admin Login</h2>
        <p>Platform administration panel.</p>
        <form id="adminLoginForm">
            <label>Admin Email</label>
            <input type="email" id="adminLoginEmail" autocomplete="off" placeholder="admin@campuscareer.bd" required>
            <label>Password</label>
            <input type="password" id="adminLoginPassword" autocomplete="new-password" placeholder="Enter admin password" required>
            <button type="submit" class="full-btn">Login</button>
        </form>
        <p id="adminLoginError" class="error-text"></p>
        <p class="auth-bottom small-link">
            Default demo login: admin@campuscareer.bd / Admin@123
        </p>
    </div>
</div>
<script src="js/script.js"></script>
</body>
</html>
