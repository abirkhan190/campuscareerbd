<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employer Dashboard | CampusCareer BD</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar">
    <a href="index.html" class="logo">
        CampusCareer<span>BD</span>
    </a>
    <div class="nav-links">
        <a href="employer-dashboard.html">Dashboard</a>
        <a href="post-job.html">Post a Job</a>
    </div>
    <button class="logout-btn" onclick="logout()">Logout</button>
</nav>

<div class="dashboard">

    <div class="dashboard-header">
        <div>
            <h1 id="welcomeText">Welcome!</h1>
            <p>Here is your hiring overview.</p>
        </div>
        <a href="post-job.html" class="primary-btn">+ Post a Job</a>
    </div>

    <div class="stats-container">
        <div class="stat-card">
            <h3 id="jobCount">0</h3>
            <p>Jobs Posted</p>
        </div>
        <div class="stat-card">
            <h3 id="totalApplicants">0</h3>
            <p>Total Applicants</p>
        </div>
        <div class="stat-card">
            <h3 id="shortlistedCount">0</h3>
            <p>Shortlisted</p>
        </div>
        <div class="stat-card">
            <h3 id="activeJobsCount">0</h3>
            <p>Approved Jobs</p>
        </div>
    </div>

    <div class="dashboard-section">
        <h2>My Job Posts</h2>
        <div id="employerJobList" class="job-list">
            <p>No jobs posted yet. Click "Post a Job" to get started.</p>
        </div>
    </div>

    <div class="dashboard-section">
        <h2>Applicants</h2>
        <div id="employerApplicantList" class="job-list">
            <p>No applicants yet.</p>
        </div>
    </div>

</div>

<script src="js/script.js"></script>
</body>
</html>
